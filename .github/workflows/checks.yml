name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install package and test tools
        run: python -m pip install -e '.[dev,mcp]'

      - name: Lint
        run: ruff check .

      - name: Compile
        run: python -m compileall -q src property_inventory.py rebuild_inventory_sqlite.py render_inventory.py verify_inventory.py

      - name: Run acceptance suite
        run: python -m unittest discover -v -s tests -p 'test_*.py'

      - name: Build release wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .

      - name: Smoke test clean wheel with MCP runtime
        shell: bash
        run: |
          python -m venv .release-smoke
          smoke_python=".release-smoke/bin/python"
          "$smoke_python" -m pip install --upgrade pip
          wheel="$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)"
          test -n "$wheel"
          "$smoke_python" -m pip install "${wheel}[mcp]"
          "$smoke_python" scripts/release_smoke.py

  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install public-boundary scanner
        run: sudo apt-get update && sudo apt-get install --yes ripgrep

      - name: Check public boundary
        run: scripts/check-public-leaks.sh

      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: --no-progress './**/*.md'
