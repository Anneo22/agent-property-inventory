<svg xmlns="http://www.w3.org/2000/svg" width="960" height="650" viewBox="0 0 960 650" role="img" aria-labelledby="title desc">
  <title id="title">Three evidence distinctions turn shortcuts into safe inventory answers</title>
  <desc id="desc">A three-row mapping. Identity moves from a shared product model through unit evidence to one physical item. Possession moves from purchase history through a physical check to confirmed or unknown current possession. Compatibility moves from similar purpose through normalized interface evidence to compatible, incompatible, conditional, or unknown.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#58a6ff"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .title { fill: #f0f6fc; font-size: 30px; font-weight: 700; }
      .subtitle { fill: #8b949e; font-size: 16px; }
      .column { fill: #8b949e; font-size: 12px; font-weight: 700; letter-spacing: 1.1px; }
      .row { fill: #58a6ff; font-size: 12px; font-weight: 700; letter-spacing: 0.6px; }
      .card-title { fill: #f0f6fc; font-size: 18px; font-weight: 700; }
      .card-copy { fill: #b1bac4; font-size: 14px; }
      .result { fill: #7ee787; font-size: 17px; font-weight: 700; }
    </style>
  </defs>
  <rect width="960" height="650" rx="24" fill="#0d1117"/>
  <rect x="1" y="1" width="958" height="648" rx="23" fill="none" stroke="#30363d" stroke-width="2"/>

  <text x="48" y="60" class="title">Three distinctions prevent confident mistakes.</text>
  <text x="48" y="90" class="subtitle">Each shortcut needs the right evidence before the agent can answer.</text>

  <text x="170" y="132" class="column">WHAT YOU HAVE</text>
  <text x="426" y="132" class="column">EVIDENCE REQUIRED</text>
  <text x="706" y="132" class="column">SAFE ANSWER</text>

  <g transform="translate(48 166)">
    <text x="0" y="58" class="row">PHYSICAL UNIT</text>
    <rect x="118" width="210" height="112" rx="15" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <text x="138" y="43" class="card-title">Product model</text>
    <text x="138" y="72" class="card-copy">shared specifications</text>
    <rect x="374" width="210" height="112" rx="15" fill="#13233a" stroke="#58a6ff" stroke-width="2"/>
    <text x="394" y="43" class="card-title">Unit evidence</text>
    <text x="394" y="72" class="card-copy">serial, photo or check</text>
    <rect x="630" width="234" height="112" rx="15" fill="#13281b" stroke="#3fb950" stroke-width="2"/>
    <text x="650" y="43" class="result">One physical item</text>
    <text x="650" y="72" class="card-copy">tracked as its own unit</text>
    <path d="M328 56 H366" stroke="#58a6ff" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M584 56 H622" stroke="#58a6ff" stroke-width="3" marker-end="url(#arrow)"/>
  </g>

  <line x1="48" y1="306" x2="912" y2="306" stroke="#21262d" stroke-width="2"/>

  <g transform="translate(48 330)">
    <text x="0" y="58" class="row">POSSESSION</text>
    <rect x="118" width="210" height="112" rx="15" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <text x="138" y="43" class="card-title">Purchase history</text>
    <text x="138" y="72" class="card-copy">cart, order or receipt</text>
    <rect x="374" width="210" height="112" rx="15" fill="#13233a" stroke="#58a6ff" stroke-width="2"/>
    <text x="394" y="43" class="card-title">Physical check</text>
    <text x="394" y="72" class="card-copy">seen or checked now</text>
    <rect x="630" width="234" height="112" rx="15" fill="#13281b" stroke="#3fb950" stroke-width="2"/>
    <text x="650" y="43" class="result">Confirmed or unknown</text>
    <text x="650" y="72" class="card-copy">never inferred from buying</text>
    <path d="M328 56 H366" stroke="#58a6ff" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M584 56 H622" stroke="#58a6ff" stroke-width="3" marker-end="url(#arrow)"/>
  </g>

  <line x1="48" y1="470" x2="912" y2="470" stroke="#21262d" stroke-width="2"/>

  <g transform="translate(48 494)">
    <text x="0" y="58" class="row">COMPATIBILITY</text>
    <rect x="118" width="210" height="112" rx="15" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <text x="138" y="43" class="card-title">Similar purpose</text>
    <text x="138" y="72" class="card-copy">looks interchangeable</text>
    <rect x="374" width="210" height="112" rx="15" fill="#13233a" stroke="#58a6ff" stroke-width="2"/>
    <text x="394" y="43" class="card-title">Interface evidence</text>
    <text x="394" y="72" class="card-copy">standard, size, direction</text>
    <rect x="630" width="234" height="112" rx="15" fill="#13281b" stroke="#3fb950" stroke-width="2"/>
    <text x="650" y="39" class="result">Compatible, incompatible,</text>
    <text x="650" y="64" class="card-copy">conditional or unknown</text>
    <path d="M328 56 H366" stroke="#58a6ff" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M584 56 H622" stroke="#58a6ff" stroke-width="3" marker-end="url(#arrow)"/>
  </g>
</svg>
