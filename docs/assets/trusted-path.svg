<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">Agents read freely while one verified path writes to the canonical ledger</title>
  <desc id="desc">An agent sends a task to the local CLI or MCP boundary. Only the trusted CLI can commit to canonical JSONL. Every write passes through locking, backup, staging, rebuild, rendering, semantic verification, and foreign-key checks. SQLite and the Markdown catalogue are rebuilt views that return scoped answers to the agent.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#58a6ff"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#3fb950"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .title { fill: #f0f6fc; font-size: 30px; font-weight: 700; }
      .subtitle { fill: #8b949e; font-size: 16px; }
      .eyebrow { fill: #8b949e; font-size: 12px; font-weight: 700; letter-spacing: 1.2px; }
      .card-title { fill: #f0f6fc; font-size: 20px; font-weight: 700; }
      .card-copy { fill: #b1bac4; font-size: 15px; }
      .label { fill: #8b949e; font-size: 14px; }
      .mono { fill: #f0f6fc; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 14px; }
    </style>
  </defs>
  <rect width="960" height="600" rx="24" fill="#0d1117"/>
  <rect x="1" y="1" width="958" height="598" rx="23" fill="none" stroke="#30363d" stroke-width="2"/>

  <text x="48" y="60" class="title">Agents read freely. One verified path writes.</text>
  <text x="48" y="90" class="subtitle">The agent does the work, but the ledger decides what becomes fact.</text>

  <g transform="translate(48 154)">
    <rect width="174" height="142" rx="16" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <text x="20" y="30" class="eyebrow">REQUEST</text>
    <text x="20" y="65" class="card-title">Agent</text>
    <text x="20" y="94" class="card-copy">query</text>
    <text x="20" y="118" class="card-copy">or prepare</text>
  </g>

  <g transform="translate(270 154)">
    <rect width="190" height="142" rx="16" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    <text x="20" y="30" class="eyebrow">LOCAL BOUNDARY</text>
    <text x="20" y="65" class="card-title">CLI + MCP</text>
    <text x="20" y="94" class="card-copy">MCP reads / prepares</text>
    <text x="20" y="118" class="card-copy">trusted CLI commits</text>
  </g>

  <g transform="translate(508 154)">
    <rect width="190" height="142" rx="16" fill="#13233a" stroke="#58a6ff" stroke-width="3"/>
    <text x="20" y="30" class="eyebrow">SOURCE OF TRUTH</text>
    <text x="20" y="65" class="card-title">Canonical JSONL</text>
    <text x="20" y="94" class="card-copy">evidence + history</text>
    <text x="20" y="118" class="card-copy">unknown stays unknown</text>
  </g>

  <g transform="translate(746 154)">
    <rect width="166" height="142" rx="16" fill="#13281b" stroke="#3fb950" stroke-width="2"/>
    <text x="20" y="30" class="eyebrow">REBUILT VIEWS</text>
    <text x="20" y="65" class="card-title">SQLite</text>
    <text x="20" y="91" class="card-title">Inventory.md</text>
    <text x="20" y="118" class="card-copy">safe to replace</text>
  </g>

  <path d="M222 225 H262" stroke="#58a6ff" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <text x="226" y="211" class="label">request</text>
  <path d="M460 225 H500" stroke="#58a6ff" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <text x="464" y="211" class="label">commit</text>
  <path d="M698 225 H738" stroke="#3fb950" stroke-width="3" marker-end="url(#arrow-green)"/>
  <text x="704" y="211" class="label">rebuild</text>

  <path d="M829 306 V352 H16 V225 H39" fill="none" stroke="#3fb950" stroke-width="2.5" stroke-dasharray="8 7"/>
  <circle cx="829" cy="306" r="5" fill="#3fb950"/>
  <path d="M38 216 L48 225 L38 234 Z" fill="#3fb950"/>
  <text x="394" y="345" class="label">scope-filtered answers</text>

  <rect x="48" y="410" width="864" height="128" rx="18" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="72" y="442" class="eyebrow">EVERY CANONICAL WRITE</text>
  <text x="72" y="480" class="mono">lock</text>
  <text x="143" y="480" class="label">→</text>
  <text x="175" y="480" class="mono">backup</text>
  <text x="264" y="480" class="label">→</text>
  <text x="296" y="480" class="mono">stage</text>
  <text x="367" y="480" class="label">→</text>
  <text x="399" y="480" class="mono">rebuild</text>
  <text x="488" y="480" class="label">→</text>
  <text x="520" y="480" class="mono">render</text>
  <text x="601" y="480" class="label">→</text>
  <text x="633" y="480" class="mono">verify</text>
  <text x="714" y="480" class="label">→</text>
  <text x="746" y="480" class="mono">replace</text>
  <text x="72" y="512" class="card-copy">Semantic checks and PRAGMA foreign_key_check must both pass before replacement.</text>
</svg>
